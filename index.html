<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:title" content="Parametric Chair" />
    <meta property="og:type" content="website" />
    <meta
      name="description"
      content="Parametric 3D generator for a chair"
    />
    <meta
      property="og:description"
      content="Parametric 3D generator for a chair"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <title>Parametric Chair</title>
  </head>
  <body>
    <div id="superseded-banner" style="position:fixed;right:12px;bottom:12px;z-index:9999;max-width:calc(100vw - 24px);padding:8px 12px;border-radius:8px;background:#1d2433;color:#fff;font:13px/1.4 system-ui,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.35)">Superseded by the <a href="https://sergiudanstan.github.io/furniture-quotation/" style="color:#9cc3ff">furniture-quotation configurator</a> (chairs and tables).</div>
    <header>
      <h1>Chair</h1>
    </header>
    <main>
      <section id="generator">
        <h2 class="hidden">Chair Generator</h2>
        <div id="part">
          <div id="canvas-container">
            <canvas aria-label="3D preview of the chair">
              3D Preview of the parametric chair. You might need to
              enable JavaScript.</canvas
            >
          </div>
          <div id="view-controls">
            <button id="btn-rotate">Rotate</button>
            <button id="btn-reset-view">Reset View</button>
          </div>
          <div id="validity"></div>
        </div>
        <div id="panel">
          <div id="controls" role="group" aria-label="Chair parameters"></div>
          <div id="downloads">
            <a id="download-3mf">3MF</a>
            <a id="download-stl">STL</a>
            <a id="download-obj">OBJ</a>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
